<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlateMate | Shopping List</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script src="../js/shopping.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="page-container">
      <!-- Back Link -->
      <a href="/meal-planner/index.html" class="recipe-back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        Back to Planner
      </a>

      <div class="shopping-header-bar">
        <div>
          <h1 class="shopping-title">Shopping List</h1>
          <p id="shopping-subtitle" class="shopping-subtitle">No items in your list</p>
        </div>
        <button type="button" id="clear-checked-btn" class="clear-checked-btn" style="display: none;">
          Clear checked
        </button>
      </div>

      <!-- Empty State -->
      <div id="shopping-empty-state" class="empty-state-card" style="display: none;">
        <div class="empty-state-icon">🛒</div>
        <h2>Your list is empty</h2>
        <p>Add recipes to your weekly planner to generate a shopping list</p>
        <a href="/meal-planner/index.html" class="empty-state-btn">Go to Planner</a>
      </div>

      <!-- Main Content -->
      <div id="shopping-content" class="shopping-content" style="display: none;">
        <!-- Progress Bar Card -->
        <div class="shopping-progress-card">
          <div class="shopping-progress-header">
            <span class="shopping-progress-label">Progress</span>
            <span id="shopping-progress-percent" class="shopping-progress-percent">0%</span>
          </div>
          <div class="shopping-progress-bar-wrap">
            <div id="shopping-progress-fill" class="shopping-progress-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Grouped Categories Container -->
        <div id="shopping-groups-container" class="shopping-groups-container"></div>
      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
