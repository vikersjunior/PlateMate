<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe & Meal Planner | Search</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="./js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <a href="/index.html">Recipe<span class="highlight">Planner</span></a>
      </div>
      <nav>
        <a href="/index.html">Search</a>
        <a href="/meal-planner/index.html">Meal Planner</a>
        <a href="/favorites/index.html">Favorites</a>
      </nav>
    </header>

    <main class="divider">
      <section class="search-section">
        <h1>Find Your Next Recipe</h1>

        <form id="search-form" class="search-form">
          <input
            type="text"
            id="search-input"
            name="query"
            placeholder="Search recipes (e.g. Chicken, Pasta, Salad)"
            required
          />
          <button type="submit">Search</button>
        </form>

        <div class="filters">
          <label>
            <input type="checkbox" name="diet" value="vegetarian" />
            Vegetarian
          </label>
          <label>
            <input type="checkbox" name="diet" value="vegan" />
            Vegan
          </label>
          <label>
            <input type="checkbox" name="diet" value="gluten-free" />
            Gluten Free
          </label>
          <label>
            <input type="checkbox" name="diet" value="keto" />
            Keto
          </label>
        </div>
      </section>

      <section class="results">
        <p id="results-status">Search for a recipe to get started.</p>
        <ul id="recipe-list" class="recipe-list"></ul>
      </section>
    </main>

    <footer>&copy; Recipe & Meal Planner - WDD 330 Final Project</footer>
  </body>
</html>
