<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlateMate | Search</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script src="./js/main.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <section class="search-section">
        <h1>Find Your Next Recipe</h1>

        <form id="search-form" class="search-form">
          <input
            type="text"
            id="search-input"
            name="query"
            placeholder="Search recipes (e.g. Chicken, Pasta, Salad)"
            required
          />
          <button type="submit">Search</button>
        </form>

        <div class="filters">
          <label>
            <input type="checkbox" name="diet" value="vegetarian" />
            Vegetarian
          </label>
          <label>
            <input type="checkbox" name="diet" value="vegan" />
            Vegan
          </label>
          <label>
            <input type="checkbox" name="diet" value="gluten free" />
            Gluten Free
          </label>
          <label>
            <input type="checkbox" name="diet" value="ketogenic" />
            Keto
          </label>
        </div>
      </section>

      <section class="results">
        <p id="results-status">Search for a recipe to get started.</p>
        <ul id="recipe-list" class="recipe-list"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
