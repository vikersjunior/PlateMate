<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe & Meal Planner | Weekly Plan</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/mealPlanner.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <a href="/index.html">Recipe<span class="highlight">Planner</span></a>
      </div>
      <nav>
        <a href="/index.html">Search</a>
        <a href="/meal-planner/index.html">Meal Planner</a>
        <a href="/favorites/index.html">Favorites</a>
      </nav>
    </header>

    <main class="divider">
      <h1>Weekly Meal Plan</h1>

      <div class="meal-planner-grid" id="meal-planner-grid">
        <div class="day-column" data-day="monday">
          <h2>Monday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="tuesday">
          <h2>Tuesday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="wednesday">
          <h2>Wednesday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="thursday">
          <h2>Thursday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="friday">
          <h2>Friday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="saturday">
          <h2>Saturday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="sunday">
          <h2>Sunday</h2>
          <ul class="day-meals"></ul>
        </div>
      </div>
    </main>

    <footer>&copy; Recipe & Meal Planner - WDD 330 Final Project</footer>
  </body>
