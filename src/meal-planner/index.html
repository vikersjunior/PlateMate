<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlateMate | Weekly Planner</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script src="../js/mealPlanner.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="page-container">
      <div class="planner-header-bar">
        <div>
          <h1 class="planner-title">Weekly Planner</h1>
          <p id="planner-subtitle" class="planner-subtitle">
            No meals planned yet — add some recipes!
          </p>
        </div>
        <button
          type="button"
          id="shopping-list-btn"
          class="shopping-list-btn"
          style="display: none"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          Generate Shopping List
        </button>
      </div>

      <!-- Empty State -->
      <div
        id="planner-empty-state"
        class="empty-state-card"
        style="display: none"
      >
        <div class="empty-state-icon">📅</div>
        <h2>Your week is wide open</h2>
        <p>Browse recipes and use "Add to Planner" to fill your week</p>
        <a href="/index.html" class="empty-state-btn">Browse Recipes</a>
      </div>

      <!-- Weekly Nutrition Summary -->
      <div id="weekly-nutrition-summary"></div>

      <!-- Days Grid -->
      <div class="planner-days-grid" id="meal-planner-grid"></div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
