<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlateMate | Weekly Plan</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script src="../js/mealPlanner.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main class="divider">
      <h1>Weekly Meal Plan</h1>

      <div class="meal-planner-grid" id="meal-planner-grid">
        <div class="day-column" data-day="monday">
          <h2>Monday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="tuesday">
          <h2>Tuesday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="wednesday">
          <h2>Wednesday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="thursday">
          <h2>Thursday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="friday">
          <h2>Friday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="saturday">
          <h2>Saturday</h2>
          <ul class="day-meals"></ul>
        </div>
        <div class="day-column" data-day="sunday">
          <h2>Sunday</h2>
          <ul class="day-meals"></ul>
        </div>
      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
